<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Roomwright: a free interior design planner with a 2D floor plan and live 3D model.">
<title>Roomwright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table app. Library rail | plan sheet + model stage | inspector. Measurements set in mono like a drawing's dimension strings. */
:root{
  --paper:#edefe9; --panel:#f8f8f4; --panel-2:#eceee8; --ink:#1f2a2e; --muted:#5d6a6c; --line:#d2d7d0;
  --accent:#28697f; --accent-ink:#ffffff; --accent-soft:#dcebef;
  --select:#c47d14; --danger:#c0412b; --danger-soft:#f6e1dc; --ok:#3b7a4d;
  --wall:#283135; --grid:rgba(40,105,127,.15); --grid-major:rgba(40,105,127,.42);
  --label-bg:#f8f8f4; --stage3d:#e2e6e0; --shadow:0 10px 30px rgba(20,32,36,.16);
  --f-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#192024; --panel:#12181a; --panel-2:#1b2326; --ink:#e2e8e6; --muted:#95a2a3; --line:#2b3639;
  --accent:#62abc6; --accent-ink:#0b1416; --accent-soft:#183340;
  --select:#e6a23c; --danger:#e3664f; --danger-soft:#3a2420; --ok:#71b585;
  --wall:#c8d0ce; --grid:rgba(98,171,198,.15); --grid-major:rgba(98,171,198,.42);
  --label-bg:#12181a; --stage3d:#1b2326; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#192024; --panel:#12181a; --panel-2:#1b2326; --ink:#e2e8e6; --muted:#95a2a3; --line:#2b3639;
  --accent:#62abc6; --accent-ink:#0b1416; --accent-soft:#183340;
  --select:#e6a23c; --danger:#e3664f; --danger-soft:#3a2420; --ok:#71b585;
  --wall:#c8d0ce; --grid:rgba(98,171,198,.15); --grid-major:rgba(98,171,198,.42);
  --label-bg:#12181a; --stage3d:#1b2326; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font:14px/1.4 var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.015em}
.brand-sub{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tog{border:1px solid var(--line);background:var(--panel-2);padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tog .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.tog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tog[aria-pressed="true"] .dot{background:currentColor}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.ib{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;width:32px;height:31px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:16px;height:16px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:grid;gap:2px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;display:grid;gap:1px}
.menu button:hover{background:var(--panel-2)}
.menu small{color:var(--muted);font-size:11.5px}

/* body */
.body{display:grid;grid-template-columns:240px minmax(0,1fr) 288px;min-height:0}
.catalog{overflow-y:auto;border-right:1px solid var(--line);padding:14px 16px 24px;background:var(--panel);touch-action:pan-y}
.cat-intro{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.cat-sec{margin-bottom:16px}
.eyebrow{font:500 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cat-sec .eyebrow{display:block;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tile{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px 6px 7px;cursor:grab;display:grid;gap:4px;user-select:none;-webkit-user-select:none;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile canvas{width:100%;height:50px;display:block}
.tile span{font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font:400 10.5px var(--f-mono);color:var(--muted)}

.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:1px;background:var(--line);min-height:0}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
#three{position:absolute;inset:0}
#three canvas{touch-action:none}
.v-tag{position:absolute;left:34px;right:150px;bottom:12px;display:flex;gap:6px;pointer-events:none;min-width:0}
.v3d .v-tag{left:12px;right:250px}
.zoom svg{width:15px;height:15px;display:block}
.mini{position:absolute;top:12px;left:12px;width:220px;height:158px;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:var(--paper);cursor:crosshair;touch-action:none}
.mini canvas{width:100%;height:100%;display:block}
.mini-tag{position:absolute;right:6px;bottom:5px;font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--label-bg);padding:2px 6px;border-radius:999px;pointer-events:none}
.abar{position:absolute;left:0;top:0;z-index:5;display:grid;justify-items:center;gap:6px;pointer-events:none;will-change:transform}
.abar>*{pointer-events:auto}
.abar-dim{font:500 11px var(--f-mono);background:var(--ink);color:var(--panel);padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow);max-width:min(80vw,420px);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.abar-dim .warn{color:var(--danger-soft);margin-left:8px;font-weight:600}
.abar-row{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.abar-row button{width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.abar-row button:hover{background:var(--panel-2)}
.abar-row button svg{width:18px;height:18px}
.abar-row .del{color:var(--danger)}
.abar-row .sep{width:1px;background:var(--line);margin:5px 3px}
.abar-sw{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.abar-pop{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);width:max-content;max-width:min(78vw,300px)}
.abar-pop .floors{grid-template-columns:repeat(4,56px)}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;font:500 11px var(--f-mono);background:var(--label-bg);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:999px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--label-bg);border-radius:7px;min-width:32px;height:30px;padding:0 9px;cursor:pointer;font-weight:600;font-size:13px}
.v-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:24px;text-align:center}
.blank-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px;z-index:2}
.blank-hint div{max-width:300px;text-align:center;background:var(--label-bg);border:1px dashed var(--accent);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.blank-hint strong{display:block;font-size:15px;margin-bottom:4px}
.blank-hint p{margin:0;color:var(--muted);font-size:13px}

.status{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:7px 16px;border-top:1px solid var(--line);font:400 12px var(--f-mono);color:var(--muted);background:var(--panel);font-variant-numeric:tabular-nums}
.status .hint{font-family:var(--f-ui);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* inspector */
.insp{overflow-y:auto;border-left:1px solid var(--line);padding:16px 16px 28px;background:var(--panel)}
.insp h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:3px 0 14px;text-wrap:balance}
.insp h3{margin:18px 0 8px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:7px 8px;font:400 13px var(--f-mono);color:var(--ink);min-width:0}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.dim{display:grid;gap:4px;min-width:0}
.dim label{font-size:12px;color:var(--muted);font-weight:500}
.dim .alt{font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-wrap{position:relative}
.unit-wrap .inp{padding-right:24px}
.unit-wrap em{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:normal 11px var(--f-mono);color:var(--muted);pointer-events:none}
.rot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.rot input{width:100%;accent-color:var(--accent)}
.rot output{font:500 12px var(--f-mono);min-width:38px;text-align:right}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--select)}
.sw input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:1px;cursor:pointer}
.floors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sw-lab{display:block;font-size:11px;color:var(--muted);margin:9px 0 5px}
.hexrow{display:flex;gap:6px;align-items:center;margin-top:9px}
.hexrow .hex{flex:1;min-width:88px;text-transform:uppercase;letter-spacing:.03em}
.hexrow .hex.bad{border-color:var(--danger);background:var(--danger-soft)}
.hexrow .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;white-space:nowrap}
.hexrow .abar-sw{width:14px;height:14px;flex:none}
.hexrow .btn:disabled{opacity:.45;cursor:default}
.abar-pop .hexrow{min-width:250px}
.hexrow .ib{flex:none}
.floors button{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px;cursor:pointer;display:grid;gap:3px;font-size:10.5px;color:var(--muted)}
.floors button[aria-pressed="true"]{border-color:var(--select);color:var(--ink);box-shadow:0 0 0 1px var(--select)}
.floors canvas{width:100%;aspect-ratio:1;border-radius:4px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.note{border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:4px 0 12px}
.stat{display:flex;justify-content:space-between;gap:12px;font:400 12.5px var(--f-mono);padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat span:first-child{font-family:var(--f-ui);color:var(--muted)}
.rlist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.rlist button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;cursor:pointer;text-align:left}
.rlist button:hover .rn{color:var(--accent)}
.rlist canvas{width:22px;height:22px;border-radius:4px;display:block}
.rn{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font:400 11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;font-size:12.5px;color:var(--muted);margin:0}
.keys dt{font:500 11px var(--f-mono);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;justify-self:start}
.keys dd{margin:0}
.insp-close{float:right}

.ghost{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:5px 8px;box-shadow:var(--shadow);font-size:12px;font-weight:600;transform:translate(-50%,-120%);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,18,.55);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(900px,100%);max-height:100%;overflow:auto;padding:16px;display:grid;gap:12px}
.modal-card img{border:1px solid var(--line);border-radius:6px;max-width:100%;background:#fff}
.modal-card p{margin:0;color:var(--muted);font-size:13px}

@media (min-width:861px){ .only-narrow{display:none!important} }
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .wide-only{display:none!important}
  .brand-sub{display:none}
  .catalog,.insp{position:fixed;left:0;right:0;bottom:0;z-index:30;border:0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(105%);transition:transform .22s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}
  .catalog{height:min(58vh,460px)}
  .insp{max-height:58vh}
  .app.cat-open .catalog,.app.insp-open .insp{transform:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .status .hint{display:none}
}
@media (max-width:600px){ .mini{width:132px;height:96px} .v3d .v-tag{display:none} .abar-row button{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){ .catalog,.insp{transition:none} }
</style>
</head>
<body>


<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3h18v18H3z"/><path d="M3 12h7v9M14 3v6h7"/><path d="M10 12a4 4 0 0 1 4-4" stroke-dasharray="2 2"/></svg>
      <span class="brand-name">Roomwright</span><span class="brand-sub">plan &amp; model</span>
    </div>
    <button class="btn only-narrow" id="btnAdd" type="button">+ Add</button>
    <div class="seg" role="group" aria-label="View" id="segView">
      <button type="button" data-v="3d">3D</button><button type="button" data-v="split" class="wide-only">Split</button><button type="button" data-v="plan">Plan</button>
    </div>
    <div class="tools">
      <button class="tog" type="button" id="tgGrid" aria-pressed="true"><span class="dot"></span>Grid</button>
      <div class="seg" role="group" aria-label="Units" id="segUnit"><button type="button" data-u="ft">ft</button><button type="button" data-u="m">m</button></div>
      <button class="tog" type="button" id="tgSnap" aria-pressed="true"><span class="dot"></span>Snap</button>
      <div class="seg" role="group" aria-label="Walls in 3D" id="segWalls"><button type="button" data-w="up" title="Show every wall at full height">Walls up</button><button type="button" data-w="cut" title="Lower the walls facing the camera">Cutaway</button><button type="button" data-w="down" title="Lower every wall">Walls down</button></div>
    </div>
    <div class="spacer"></div>
    <button class="ib" type="button" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" type="button" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="menu-wrap">
      <button class="btn" type="button" id="btnNew" aria-haspopup="true" aria-expanded="false">New</button>
      <div class="menu" id="menuNew" hidden>
        <button type="button" data-new="blank">Blank project<small>Empty canvas — start from scratch</small></button>
        <button type="button" data-new="sample">Sample apartment<small>The furnished five-room demo</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="btn primary" type="button" id="btnExport" aria-haspopup="true" aria-expanded="false">Export</button>
      <div class="menu" id="menuExport" hidden>
        <button type="button" data-x="plan">Plan drawing<small>PNG, framed to your rooms</small></button>
        <button type="button" data-x="3d">3D view<small>PNG of the current camera</small></button>
        <button type="button" data-x="pdf">Presentation sheet<small>PDF with plan, 3D and room schedule</small></button>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="catalog" id="catalog" aria-label="Library">
      <p class="cat-intro">Drag onto the plan or the 3D view. Tap to drop into the middle of the view.</p>
      <div id="catList"></div>
    </aside>

    <main class="stage">
      <div class="views">
        <section class="view v2d" id="v2d" aria-label="Floor plan">
          <canvas id="plan"></canvas>
          <div class="blank-hint" hidden><div><strong>Blank project</strong><p class="bh-text"></p></div></div>
          <div class="v-tag"><span class="chip" id="gridChip"></span></div>
          <div class="zoom"><button type="button" id="zOut" aria-label="Zoom out">−</button><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zFit">Fit</button></div>
        </section>
        <section class="view v3d" id="v3d" aria-label="3D model">
          <div id="three"></div>
          <div class="blank-hint" hidden><div><strong>Blank project</strong><p class="bh-text"></p></div></div>
          <div class="mini" id="miniWrap" hidden><canvas id="mini" aria-label="Mini floor plan. Click to move the camera there."></canvas><span class="mini-tag">Plan</span></div>
          <div class="abar" id="abar" hidden><div class="abar-pop" id="abarPop" hidden></div><div class="abar-dim" id="abarDim"></div><div class="abar-row" id="abarRow" role="toolbar" aria-label="Selection actions"></div></div>
          <div class="v-tag"><span class="chip">WASD pan · Q E rotate · scroll zoom · double-click to pick up</span></div>
          <div class="zoom cam">

function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }

const floorCv = {};
function noise(g,N,amt,R){ const im=g.getImageData(0,0,N,N), d=im.data; for(let i=0;i<d.length;i+=4){ const n=(R()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(im,0,0); }

/* ---------------- geometry helpers ---------------- */
function corners(it){ const c=Math.cos(it.rot*DEG), s=Math.sin(it.rot*DEG), hw=it.w/2, hd=it.d/2;

function snapItem(it, px, free){

function edgeResize(r,side,wx,wy,px,free){ const min=1.0;

const MIN_ITEM = 0.2;

/* ---------------- history ---------------- */
const hist=[], fut=[];
const snapshot = () => JSON.stringify({r:S.rooms,i:S.items,o:S.opens});
let lastSnap = '';
function commit(){ const s=snapshot(); if(s===lastSnap) return changed(); hist.push(lastSnap); if(hist.length>120) hist.shift(); fut.length=0; lastSnap=s; changed(); }
function restore(s){ const o=JSON.parse(s); S.rooms=o.r; S.items=o.i; S.opens=o.o; if(S.sel && !findSel()) S.sel=null; changed(); }
function undo(){ if(X.carry) cancelCarry(); if(!hist.length) return; fut.push(lastSnap); lastSnap=hist.pop(); restore(lastSnap); toast('Undone'); }

function blankHint(){ const empty=!S.rooms.length&&!S.items.length&&!S.opens.length;

/* ---------------- 2D plan ---------------- */
const P = { cv:$('#plan'), ctx:null, W:0, H:0, dpr:1, v:{s:60,x:40,y:40}, dirty:false, cursor:null };
P.ctx = P.cv.getContext('2d');

const w2s = (v,x,y) => [x*v.s+v.x, y*v.s+v.y];
const s2w = (v,x,y) => [(x-v.x)/v.s, (y-v.y)/v.s];

function resizePlan(){ const r=$('#v2d').getBoundingClientRect(); P.dpr=Math.min(window.devicePixelRatio||1,2); P.W=r.width; P.H=r.height; P.cv.width=Math.max(1,r.width*P.dpr); P.cv.height=Math.max(1,r.height*P.dpr); req2D(); }
function drawPlanLive(){ const g=P.ctx; g.setTransform(P.dpr,0,0,P.dpr,0,0); drawPlan(g,P.W,P.H,P.v,{live:true}); }
function fitPlan(){
  const b=bounds(), pad=0.9, W=P.W-RULER-24, H=P.H-RULER-56; if(W<=0||H<=0) return;
  const s=Math.max(14,Math.min(220, Math.min(W/(b.x1-b.x0+pad*2), H/(b.y1-b.y0+pad*2))));

}
function gridSteps(v){
  const um=S.unit==='ft'? 1/M2FT : 1, cands=S.unit==='ft'? [0.5,1,2,5,10,25,50,100] : [0.1,0.25,0.5,1,2,5,10,20,50];
  const minor=cands.find(c=>c*um*v.s>=11)||cands[cands.length-1];
  const major=cands.find(c=>c>minor && c*um*v.s>=56 && Math.abs(c/minor-Math.round(c/minor))<1e-6)||minor*5;

function drawPlan(g,W,H,v,opt){

    g.lineWidth=1;
    const i0=Math.floor(x0/st.minor), i1=Math.ceil(x1/st.minor), j0=Math.floor(y0/st.minor), j1=Math.ceil(y1/st.minor);

    g.fillRect(sx,sy,w,t); g.fillRect(sx,sy+d-t,w,t); g.fillRect(sx,sy,t,d); g.fillRect(sx+w-t,sy,t,d);

function drawOpening(g,o,v,selected){
  const a=o.ax==='h'?[1,0]:[0,1], n=o.ax==='h'?[0,1]:[1,0], s=o.flip?-1:1, hw=o.w/2;
  const Pt=(u,t)=>w2s(v,o.x+a[0]*u+n[0]*t, o.y+a[1]*u+n[1]*t);

  g.strokeStyle=T.wall; g.lineWidth=2;
  g.beginPath(); let p=Pt(-hw,-WT); g.moveTo(...p); p=Pt(-hw,WT); g.lineTo(...p); p=Pt(hw,-WT); g.moveTo(...p); p=Pt(hw,WT); g.lineTo(...p); g.stroke();
  const col = selected? T.sel : T.ink;
  if(o.k==='door'||o.k==='door2'){
    const leaves = o.k==='door2'? [[-hw,hw,1],[hw,hw,-1]] : [[-hw,o.w,1]];
    for(const [hu,r,dir] of leaves){
      g.strokeStyle=col; g.lineWidth=2.2; g.beginPath(); g.moveTo(...Pt(hu,0)); g.lineTo(...Pt(hu,s*r)); g.stroke();
      g.lineWidth=1; g.setLineDash([4,3]); g.strokeStyle=selected?T.sel:T.muted; g.beginPath();
      for(let k=0;k<=24;k++){ const th=k/24*Math.PI/2, q=Pt(hu+dir*r*Math.cos(th), s*r*Math.sin(th)); k?g.lineTo(...q):g.moveTo(...q); } g.stroke(); g.setLineDash([]);
    }
  } else {
    g.fillStyle=T.label; poly([Pt(-hw,-WT*.7),Pt(hw,-WT*.7),Pt(hw,WT*.7),Pt(-hw,WT*.7)]); g.fill();
    g.strokeStyle=selected?T.sel:T.accent; g.lineWidth=1.4;
    for(const t of [-WT*.7,0,WT*.7]){ g.beginPath(); g.moveTo(...Pt(-hw,t)); g.lineTo(...Pt(hw,t)); g.stroke(); }
  }
  if(selected){ g.strokeStyle=T.sel; g.lineWidth=1.5; g.setLineDash([5,4]); poly([Pt(-hw-.05,-WT-.08),Pt(hw+.05,-WT-.08),Pt(hw+.05,WT+.08),Pt(-hw-.05,WT+.08)]); g.stroke(); g.setLineDash([]);

}

function drawSymbol(g,it,px){

function hitTest(wx,wy,v){

    if(Math.abs(along)<=o.w/2 && Math.abs(perp)<=Math.max(WT+.04,8*px)) return {t:'open',o}; }
  const items=[...S.items].sort((a,b)=>(KINDS[b.k].floor?1:0)-(KINDS[a.k].floor?1:0));
  for(let i=items.length-1;i>=0;i--){ if(KINDS[items[i].k].floor) continue; const [lx,ly]=toLocal(items[i],wx,wy); if(Math.abs(lx)<=items[i].w/2&&Math.abs(ly)<=items[i].d/2) return {t:'item',o:items[i]}; }
  for(let i=items.length-1;i>=0;i--){ if(!KINDS[items[i].k].floor) continue; const [lx,ly]=toLocal(items[i],wx,wy); if(Math.abs(lx)<=items[i].w/2&&Math.abs(ly)<=items[i].d/2) return {t:'item',o:items[i]}; }
  const r=roomAt(wx,wy); if(r) return {t:'room',o:r};

}
function handleHit(sx,sy,v){
  const o=findSel(); if(!o) return null;

    if(Math.hypot(sx-rp[0],sy-rp[1])<12) return 'rot';
    let best=null, bd=11; // nearest handle wins; corners get a slight edge

const ghost=$('#ghost');
function bindTile(b){
  let st=null;
  b.addEventListener('pointerdown',e=>{ if(e.button!==0) return; st={x:e.clientX,y:e.clientY,drag:false,id:e.pointerId}; if(e.pointerType==='mouse'){ try{ b.setPointerCapture(e.pointerId); }catch(_){} } });
  b.addEventListener('pointermove',e=>{ if(!st||st.id!==e.pointerId) return;
    if(!st.drag && Math.hypot(e.clientX-st.x,e.clientY-st.y)>6){ st.drag=true; try{ b.setPointerCapture(e.pointerId); }catch(_){} ghost.textContent=b._spec.label; ghost.hidden=false; document.body.style.cursor='grabbing'; if(isNarrow()) $('#app').classList.remove('cat-open'); }
    if(st.drag){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; ghost.hidden=!!preview3D(b._spec,e.clientX,e.clientY); } });
  b.addEventListener('pointerup',e=>{ if(!st) return; const s=st; st=null; ghost.hidden=true; document.body.style.cursor=''; hidePreview();
    if(!s.drag){
      if(b._spec.type==='item' && X.ok && S.view==='3d' && e.pointerType==='mouse' && !isNarrow()){
        const [wx,wy]=viewCenter(), it=makeItem(b._spec.k,wx,wy); S.items.push(it); S.sel={t:'item',id:it.id}; changed();
        startCarry(it,'held',{isNew:true}); toast(`${b._spec.label} picked up · click in the room to place · Esc cancels`); return; }
      const [wx,wy]=viewCenter(); addSpec(b._spec,wx,wy); if(isNarrow()) $('#app').classList.remove('cat-open'); return; }
    const pr=P.cv.getBoundingClientRect();
    if(!$('#v2d').hidden && e.clientX>=pr.left&&e.clientX<=pr.right&&e.clientY>=pr.top&&e.clientY<=pr.bottom){ const [wx,wy]=s2w(P.v,e.clientX-pr.left,e.clientY-pr.top); addSpec(b._spec,wx,wy); return; }
    if(X.ok && !$('#v3d').hidden){ const r=X.renderer.domElement.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){ const fp=floorPoint(e.clientX,e.clientY); if(fp){ addSpec(b._spec,fp[0],fp[1]); return; } } }
  });
  b.addEventListener('pointercancel',()=>{ st=null; ghost.hidden=true; document.body.style.cursor=''; hidePreview(); });
  b.addEventListener('click',e=>{ if(e.detail===0){ const [wx,wy]=viewCenter(); addSpec(b._spec,wx,wy); } }); // keyboard activation
}

let toastT=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
function showModal(title,text,src){ $('#modalTitle').textContent=title; $('#modalText').textContent=text; const im=$('#modalImg'); im.hidden=!src; if(src) im.src=src; $('#modal').hidden=false; }
$('#modalClose').onclick=()=>$('#modal').hidden=true;
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').hidden=true; });

/* ---------------- export ---------------- */
const dlP = (window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
function withLight(fn){ const root=document.documentElement, prev=root.getAttribute('data-theme'); root.setAttribute('data-theme','light'); readTokens();
  try{ return fn(); } finally { if(prev===null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme',prev); readTokens(); } }
function planCanvas(){
  return withLight(()=>{ const b=bounds(), pad=1.1, s=60, w=(b.x1-b.x0+pad*2)*s, h=(b.y1-b.y0+pad*2)*s, k=2;
    const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k+44*k); const g=c.getContext('2d'); g.setTransform(k,0,0,k,0,0);
    const v={s,x:(pad-b.x0)*s,y:(pad-b.y0)*s+30}; drawPlan(g,w,h+44,v,{dims:true});
    g.fillStyle=T.ink; g.font='600 15px "Instrument Sans", system-ui, sans-serif'; g.textBaseline='top'; g.fillText('Floor plan',16,12);
    const bar=S.unit==='ft'? 5/M2FT : 1, lbl=S.unit==='ft'? '5 ft' : '1 m', by=h+20;
    g.fillStyle=T.ink; g.fillRect(16,by,bar*s,4); g.fillStyle=T.paper; g.fillRect(16+bar*s/2,by+1,bar*s/2-1,2);
    g.fillStyle=T.muted; g.font='400 11px "DM Mono", monospace'; g.fillText(lbl+(S.grid?`  ·  grid ${unitTick(gridSteps(v).minorU)} squares`:''),24+bar*s,by-3);
    return c; });
}
function snapAll(){ Object.assign(X.orbit,X.goal);
  X.itemG.forEach((e,id)=>{ const it=S.items.find(i=>i.id===id); if(it){ e.g.position.set(it.x,0,it.y); e.g.rotation.y=-it.rot*DEG; e.g.scale.set(1,1,1); e.pulse=0; } });
  X.walls.forEach(w=>{ w.cut=wallWant(w); applyWall(w); }); }
function threeDataURL(){ if(!X.ok) return null; const R=X.renderer, size=new THREE.Vector2(); R.getSize(size);
  sync3D(); snapAll(); const ov=X.overlay.visible; X.overlay.visible=false;
  R.setSize(1600,1000,false); X.cam.aspect=1.6; X.cam.updateProjectionMatrix(); render3D(); const url=R.domElement.toDataURL('image/png');
  X.overlay.visible=ov; if(size.x>1){ R.setSize(size.x,size.y,false); X.cam.aspect=size.x/size.y; X.cam.updateProjectionMatrix(); } X.need=true; return url; }
async function toBlob(dataUrl){ return (await fetch(dataUrl)).blob(); }
async function offer(filename, blob, previewUrl){
  if(!window.claude){ const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Saved '+filename); return; }
  const dl=await dlP;
  if(!dl){ if(previewUrl) showModal('Your export is ready','Saving files isn\'t available in this view. Right-click or long-press the image to save it.',previewUrl); else showModal('Saving isn\'t available here','This view can\'t save files. Open the page in claude.ai to save the PDF, or export a PNG and save it from the preview.'); return; }
  try{ await dl.save({filename,data:blob}); toast('Saved '+filename); }
  catch(err){ const c=err&&err.code; if(c==='declined') toast('Save cancelled'); else if(c==='rate_limited') toast('A save prompt is already open'); else if(previewUrl) showModal('Your export is ready','Saving files isn\'t available in this view. Right-click or long-press the image to save it.',previewUrl); else toast('Couldn\'t save the file in this view'); }
}
async function doExport(kind){
  $('#menuExport').hidden=true; $('#btnExport').setAttribute('aria-expanded','false');
  const stamp=new Date().toISOString().slice(0,10);
  if(kind==='plan'){ const url=planCanvas().toDataURL('image/png'); return offer(`roomwright-plan-${stamp}.png`, await toBlob(url), url); }
  if(kind==='3d'){ const url=threeDataURL(); if(!url) return toast('3D view isn\'t available'); return offer(`roomwright-3d-${stamp}.png`, await toBlob(url), url); }
  if(!window.jspdf){ return toast('The PDF library didn\'t load. Export a PNG instead.'); }
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'letter'}), PW=792, PH=612, m=36;
  const ascii=s=>s.replace(/′/g,"'").replace(/″/g,'"').replace(/m²/g,'sq m').replace(/·/g,'/');
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Roomwright layout',m,m+12);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(95,106,108);
  const total=S.rooms.reduce((a,r)=>a+r.w*r.d,0);
  doc.text(ascii(`${stamp}   /   ${S.rooms.length} rooms   /   ${fmtArea(total)}`),m,m+28);
  const pc=planCanvas(), pr=pc.width/pc.height, bw=480, bh=500; let iw=bw, ih=bw/pr; if(ih>bh){ ih=bh; iw=bh*pr; }
  doc.addImage(pc.toDataURL('image/png'),'PNG',m,m+44,iw,ih);
  const x2=m+bw+20, w2=PW-m-x2; let y=m+44;
  const tu=threeDataURL(); if(tu){ doc.addImage(tu,'PNG',x2,y,w2,w2/1.6); y+=w2/1.6+22; }
  doc.setTextColor(31,42,46); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Room schedule',x2,y); y+=14;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  for(const r of S.rooms){ if(y>PH-m-60) break; doc.text(ascii(r.n),x2,y); doc.text(ascii(`${fmtLen(r.w)} x ${fmtLen(r.d)}`),x2+82,y); doc.text(ascii(fmtArea(r.w*r.d).split(' · ')[0]),x2+w2,y,{align:'right'}); y+=12; }
  y+=8; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Furniture',x2,y); y+=14; doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  const counts={}; S.items.forEach(i=>{ const n=KINDS[i.k].n; counts[n]=(counts[n]||0)+1; });
  const lines=Object.entries(counts).map(([n,c])=>`${c} x ${n}`); const col=Math.ceil(lines.length/2);
  lines.forEach((l,i)=>{ const cx=x2+(i>=col?w2/2:0), cy=y+(i%col)*11; if(cy<PH-m-10) doc.text(l,cx,cy); });
  doc.setTextColor(95,106,108); doc.setFontSize(8); doc.text(ascii(`Units: ${S.unit==='ft'?'feet and inches (metric in brackets on the plan)':'metres (imperial alongside on the plan)'}`),m,PH-m+8);
  offer(`roomwright-sheet-${stamp}.pdf`, doc.output('blob'), null);
}
$('#btnExport').onclick=e=>{ const m=$('#menuExport'); m.hidden=!m.hidden; e.currentTarget.setAttribute('aria-expanded',String(!m.hidden)); };
$('#menuExport').addEventListener('click',e=>{ const b=e.target.closest('[data-x]'); if(b) doExport(b.dataset.x); });
function closeMenus(except){ [['#menuExport','#btnExport'],['#menuNew','#btnNew']].forEach(([m,b])=>{ if(m===except) return; $(m).hidden=true; $(b).setAttribute('aria-expanded','false'); }); }
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu-wrap')) closeMenus(); });
$('#btnNew').onclick=e=>{ closeMenus('#menuNew'); const m=$('#menuNew'); m.hidden=!m.hidden; e.currentTarget.setAttribute('aria-expanded',String(!m.hidden)); };
$('#menuNew').addEventListener('click',e=>{ const b=e.target.closest('[data-new]'); if(b) newProject(b.dataset.new); });
function newProject(kind){
  closeMenus(); if(X.carry) cancelCarry(); closeAbarPop();
  S.rooms=[]; S.items=[]; S.opens=[]; S.sel=null;
  if(kind==='sample') sample();
  commit(); syncSheets();
  requestAnimationFrame(()=>{ fitPlan(); if(X.ok) resetCam(); });
  toast(kind==='sample' ? 'Loaded the sample apartment. Ctrl+Z to undo.' : 'Started a blank project. Ctrl+Z brings the old one back.');
}

/* ---------------- toolbar & layout ---------------- */
const isNarrow = () => window.matchMedia('(max-width: 860px)').matches;
function setPressed(sel,attr,val){ document.querySelectorAll(sel+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val))); }
function applyView(){
  let v=S.view; if(isNarrow()&&v==='split') v='plan';
  $('#v2d').hidden = v==='3d'; $('#v3d').hidden = v==='plan';
  setPressed('#segView','v',v); $('#segWalls').hidden = v==='plan'; $('#miniWrap').hidden = v!=='3d' || !X.ok; if(v==='plan') $('#abar').hidden=true; X.need=true; updateStatus();
  requestAnimationFrame(()=>{ resizePlan(); resize3D(); req3D(); });
}
function syncSheets(){ const app=$('#app'); if(isNarrow()) app.classList.toggle('insp-open', !!S.sel); else app.classList.remove('insp-open'); }
$('#segView').onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b) return; S.view=b.dataset.v; applyView(); };
$('#segUnit').onclick=e=>{ const b=e.target.closest('[data-u]'); if(!b) return; S.unit=b.dataset.u; setPressed('#segUnit','u',S.unit); buildCatalog(); renderInspector(); req2D(); req3D(); };
$('#segWalls').onclick=e=>{ const b=e.target.closest('[data-w]'); if(!b) return; S.walls=b.dataset.w; setPressed('#segWalls','w',S.walls); X.need=true; };
function toggleGrid(){ S.grid=!S.grid; $('#tgGrid').setAttribute('aria-pressed',String(S.grid)); req2D(); req3D(); }
$('#tgGrid').onclick=toggleGrid;
$('#tgSnap').onclick=()=>{ S.snap=!S.snap; $('#tgSnap').setAttribute('aria-pressed',String(S.snap)); toast(S.snap?'Snapping on: grid and walls':'Snapping off'); };
$('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
$('#btnAdd').onclick=()=>{ $('#app').classList.toggle('cat-open'); $('#app').classList.remove('insp-open'); };

const KEYMAP={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};
window.addEventListener('keydown',e=>{
  const tg=e.target; if(tg && (tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA')) return;
  const mod=e.ctrlKey||e.metaKey, o=findSel(), k=e.key.toLowerCase(), in3d=X.ok && !$('#v3d').hidden;
  if(e.key==='Escape'){ if(X.carry){ cancelCarry(); return; } closeAbarPop(); select(null); closeMenus(); $('#modal').hidden=true; return; }
  if(mod){ if(X.carry) return;
    if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(k==='y'){ e.preventDefault(); redo(); return; }
    if(k==='d'){ e.preventDefault(); duplicateSel(); return; }
    return; }
  if(in3d){
    if('wasd'.includes(k)&&k.length===1 || (KEYMAP[k] && (!o || X.carry))){ X.keys.add(KEYMAP[k]||k); X.need=true; e.preventDefault(); return; }
    if(k==='q'||k==='e'){ rotateCam(k==='q'?-1:1); return; }
    if(k==='='||k==='+'){ zoom3D(.8); return; } if(k==='-'||k==='_'){ zoom3D(1.25); return; }
    if(k==='m' && o && S.sel.t==='item' && !X.carry){ startCarry(o,'held'); toast('Picked up · click to place · Esc puts it back'); return; }
    if(k==='f' && o && S.sel.t!=='open'){ focusSel(); return; }
  }
  if(k===','||k==='<'){ rotCarry(-45); return; } if(k==='.'||k==='>'){ rotCarry(45); return; }
  if(k==='g'){ toggleGrid(); return; }
  if(X.carry){ if(k==='r') rotCarry(e.shiftKey?-90:90); return; }
  if(!o) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(k==='r'&&S.sel.t==='item'){ o.rot=(o.rot+(e.shiftKey?270:90))%360; commit(); return; }
  if(k==='f'&&S.sel.t==='open'){ o.flip=!o.flip; commit(); return; }
  const st=(e.shiftKey?4:1)*itemStep(), dmap={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]};
  if(dmap[e.key]){ e.preventDefault(); o.x+=dmap[e.key][0]; o.y+=dmap[e.key][1]; if(S.sel.t==='open') placeOpening(o,o.x,o.y,true); commit(); }
});
const isField=el=>el&&(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'||el.isContentEditable);
document.addEventListener('copy',e=>{ if(isField(document.activeElement)) return; const ws=window.getSelection(); if(ws&&String(ws).length) return;
  const o=findSel(); if(!o||S.sel.t!=='item'||X.carry) return; e.preventDefault(); e.clipboardData.setData('text/plain',String(o.c).toUpperCase()); copyColor(String(o.c),true); });
document.addEventListener('paste',e=>{ if(isField(document.activeElement)) return; const o=findSel(); if(!o||S.sel.t!=='item'||X.carry) return;
  const c=parseColor(e.clipboardData&&e.clipboardData.getData('text/plain'))||CLIP; if(!c) return; e.preventDefault(); applyColor(o,c); });
window.addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); X.keys.delete(KEYMAP[k]||k); });
window.addEventListener('blur',()=>X.keys.clear());

/* ---------------- sample layout ---------------- */
function sample(){
  const room=(n,x,y,w,d,f)=>{ const r={id:nid('r'),n,x,y,w,d,f}; S.rooms.push(r); return r; };
  const item=(k,x,y,rot=0,extra={})=>{ const K=KINDS[k]; S.items.push(Object.assign({id:nid('i'),k,n:K.n,x,y,rot,w:K.w,d:K.d,h:K.h,c:K.c},extra)); };
  const open=(k,x,y,ax,flip=false,w)=>S.opens.push({id:nid('o'),k,x,y,ax,w:w||OPENS[k].w,flip});
  room('Living room',0,0,5.4,4.6,'oak'); room('Kitchen',5.4,0,3.6,2.8,'checker'); room('Dining room',5.4,2.8,3.6,3.2,'parquet');
  room('Bedroom',0,4.6,5.4,3.8,'carpet'); room('Bathroom',5.4,6.0,3.6,2.4,'marble');
  // living
  item('rug',2.5,2.75); item('sofa',2.5,4.02,180); item('coffee',2.5,2.75); item('tvstand',2.5,.345,0);
  item('armchair',.545,2.6,270,{c:'#9b5b44'}); item('armchair',4.4,2.75,90,{c:'#9b5b44'}); item('lamp',.45,4.1); item('plant',4.9,.5); item('shelf',.295,1.05,270);
  // kitchen
  item('fridge',5.97,.495); item('counter',7.02,.43); item('sink',8.07,.43); item('range',8.555,1.65,90); item('island',7.0,1.95);
  // dining
  item('dtable',7.2,4.3); item('chair',6.75,3.59); item('chair',7.65,3.59); item('chair',6.75,5.01,180); item('chair',7.65,5.01,180); item('chair',6.03,4.3,270); item('chair',8.37,4.3,90);
  item('sideboard',7.2,5.655,180);
  // bedroom
  item('qbed',2.7,5.77); item('nightstand',1.6,4.92); item('nightstand',3.8,4.92); item('dresser',2.7,8.03,180); item('wardrobe',.42,7.2,270); item('desk',4.93,7.4,90); item('ochair',4.2,7.4,270);
  // bath
  item('tub',6.37,7.905,180); item('toilet',8.53,7.0,90); item('vanity',7.3,6.37);
  // doors & windows
  open('door',0,1.6,'v',false); open('door',4.5,4.6,'h',false); open('door2',5.4,3.7,'v',false,1.4); open('door',6.4,2.8,'h',true); open('door',5.4,6.6,'v',false);
  open('window2',2.5,0,'h'); open('window',7.0,0,'h'); open('window2',9.0,4.3,'v'); open('window',1.3,8.4,'h'); open('window',9.0,7.4,'v',false,.7); open('window',0,6.2,'v');
}

/* ---------------- boot ---------------- */
readTokens();
const onTheme=()=>{ readTokens(); drawIcons(); renderInspector(); req2D(); req3D(); if(X.ok){ X.itemG.forEach((e,id)=>{ const it=S.items.find(i=>i.id===id); if(it) setFlags(e.g,it); }); } };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
sample(); lastSnap=snapshot();
setPressed('#segUnit','u',S.unit); setPressed('#segWalls','w',S.walls); setPressed('#segView','v',S.view);
buildCatalog(); init3D();
new ResizeObserver(()=>{ resizePlan(); }).observe($('#v2d'));
new ResizeObserver(()=>{ resize3D(); }).observe($('#v3d'));
window.addEventListener('resize',()=>{ applyView(); syncSheets(); });
applyView(); computeCollisions(); renderInspector(); updateStatus(); $('#btnUndo').disabled=true; $('#btnRedo').disabled=true;
requestAnimationFrame(()=>{ resizePlan(); fitPlan(); resize3D(); resetCam(true); setTimeout(()=>{ X.booted=true; },900); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ drawIcons(); req2D(); });
})();
</script>
